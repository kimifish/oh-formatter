[project]
name = "oh-formatter"
version = "0.1.0"
description = "Formatter for openHAB configuration files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openhab-items-format = "openhab_formatter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhab_formatter"]
